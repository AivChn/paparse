[package]
name = "paparse"
version = "1.1.1"
edition = "2024"
repository = "git@github.com:AivChn/paparse.git"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
zip = "8.6.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
